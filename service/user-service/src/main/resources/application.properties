spring.application.name=user-service
server.port=8083

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/users-db
spring.datasource.username=user_postgres_username
spring.datasource.password=user_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis Session
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.store-type=redis

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/strawberries

# OAuth2 Client
spring.security.oauth2.client.registration.user-service-client.client-id=user-service-client
spring.security.oauth2.client.registration.user-service-client.client-secret=SECRET_HERE
spring.security.oauth2.client.registration.user-service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.user-service-client.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/strawberries